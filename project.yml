name: Annotator

options:
  # The fabiosouto.me domain, reversed.
  bundleIdPrefix: me.fabiosouto
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Outside the Mac App Store: hardened runtime for notarization, no sandbox.
    ENABLE_HARDENED_RUNTIME: YES

packages:
  AnnotatorKit:
    path: Packages/AnnotatorKit

targets:
  Annotator:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: AnnotatorKit
        product: AnnotatorUI
      # The Share menu entry, embedded in Contents/PlugIns.
      - target: AnnotatorShare
      # The command-line tool ships inside the bundle, at Contents/Helpers/annotator;
      # the script below puts it there.
      - target: AnnotatorCLI
        embed: false
    postBuildScripts:
      # A copy phase would look for a product named after the target, AnnotatorCLI,
      # and quietly copy nothing. The tool is signed like the app, before the app.
      - name: Embed the command-line tool
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/annotator
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Helpers/annotator
        script: |
          helpers="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Helpers"
          mkdir -p "$helpers"
          cp -f "$BUILT_PRODUCTS_DIR/annotator" "$helpers/annotator"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --options runtime --timestamp=none "$helpers/annotator"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Annotator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu-bar app: no Dock icon.
        LSUIElement: true
        NSHumanReadableCopyright: Licensed under the GNU General Public License v3.0.
        # "Annotate with Annotator" in other apps' Services menus.
        NSServices:
          - NSMenuItem:
              default: Annotate with Annotator
            NSMessage: annotateSelection
            NSPortName: Annotator
            NSSendTypes:
              - NSStringPboardType
              - public.utf8-plain-text
        # The Share extension hands files over with annotator://open?path=…
        CFBundleURLTypes:
          - CFBundleURLName: me.fabiosouto.Annotator
            CFBundleURLSchemes:
              - annotator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fabiosouto.Annotator
        PRODUCT_NAME: Annotator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Named AnnotatorCLI because a target called "annotator" would collide with
  # "Annotator" on a case-insensitive disk. The product is still `annotator`.
  AnnotatorCLI:
    type: tool
    platform: macOS
    sources:
      - path: CLI
    dependencies:
      - package: AnnotatorKit
        product: AnnotatorCLIKit
    settings:
      base:
        PRODUCT_NAME: annotator
        PRODUCT_BUNDLE_IDENTIFIER: me.fabiosouto.Annotator.cli
        SKIP_INSTALL: YES

  # The Share menu entry in Finder and Preview. An extension must be sandboxed
  # even though the app is not; it only passes the file's path on to the app.
  AnnotatorShare:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - "*.entitlements"
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Annotator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: ShareExtension/AnnotatorShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fabiosouto.Annotator.Share
        PRODUCT_NAME: AnnotatorShare
