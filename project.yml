name: Callout

options:
  # The fabiosouto.me domain, reversed.
  bundleIdPrefix: me.fabiosouto
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Outside the Mac App Store: hardened runtime for notarization, no sandbox.
    ENABLE_HARDENED_RUNTIME: YES

packages:
  CalloutKit:
    path: Packages/CalloutKit

targets:
  Callout:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: CalloutKit
        product: CalloutUI
      # The Share menu entry, embedded in Contents/PlugIns.
      - target: CalloutShare
      # The command-line tool ships inside the bundle, at Contents/Helpers/callout;
      # the script below puts it there.
      - target: CalloutCLI
        embed: false
    postBuildScripts:
      # A copy phase would look for a product named after the target, CalloutCLI,
      # and quietly copy nothing. The tool is signed like the app, before the app.
      - name: Embed the command-line tool
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/callout
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Helpers/callout
        script: |
          helpers="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Helpers"
          mkdir -p "$helpers"
          cp -f "$BUILT_PRODUCTS_DIR/callout" "$helpers/callout"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --options runtime --timestamp=none "$helpers/callout"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Callout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu-bar app: no Dock icon.
        LSUIElement: true
        NSHumanReadableCopyright: Free software under the GNU General Public License, version 3.
        LSApplicationCategoryType: public.app-category.productivity
        # "Annotate with Callout" in other apps' Services menus.
        NSServices:
          - NSMenuItem:
              default: Annotate with Callout
            NSMessage: annotateSelection
            NSPortName: Callout
            NSSendTypes:
              - NSStringPboardType
              - public.utf8-plain-text
        # The Share extension hands files over with callout://open?path=…
        CFBundleURLTypes:
          - CFBundleURLName: me.fabiosouto.Callout
            CFBundleURLSchemes:
              - callout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fabiosouto.Callout
        PRODUCT_NAME: Callout
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Named CalloutCLI because a target called "callout" would collide with
  # "Callout" on a case-insensitive disk. The product is still `callout`.
  CalloutCLI:
    type: tool
    platform: macOS
    sources:
      - path: CLI
    dependencies:
      - package: CalloutKit
        product: CalloutCLIKit
    settings:
      base:
        PRODUCT_NAME: callout
        PRODUCT_BUNDLE_IDENTIFIER: me.fabiosouto.Callout.cli
        SKIP_INSTALL: YES

  # The Share menu entry in Finder and Preview. An extension must be sandboxed
  # even though the app is not; it only passes the file's path on to the app.
  CalloutShare:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - "*.entitlements"
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Callout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: ShareExtension/CalloutShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fabiosouto.Callout.Share
        PRODUCT_NAME: CalloutShare
